<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Você é um dev freelancer em Osasco e Cotia: dirija até os clientes e resolva as tasks em HTML, CSS, JavaScript e TypeScript para subir de estagiário a full stack."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Freela na Estrada</title>
  </head>
  <body>
    <canvas id="game" aria-label="O carro do dev na estrada"></canvas>
    <div id="hud" class="hud">
      <header class="hud__title">
        <h1>Freela na Estrada</h1>
        <p>Protótipo · indo atender o próximo cliente</p>
      </header>
      <dl class="hud__panel">
        <div>
          <dt>Hora</dt>
          <dd id="hud-clock">--:--</dd>
        </div>
        <div>
          <dt>Velocidade</dt>
          <dd id="hud-speed">0 km/h</dd>
        </div>
        <div>
          <dt>Senioridade</dt>
          <dd id="hud-seniority">Estagiário</dd>
        </div>
        <div>
          <dt>Carro</dt>
          <dd id="hud-car">—</dd>
        </div>
        <div>
          <dt>Tanque</dt>
          <dd id="hud-fuel">--</dd>
        </div>
        <div>
          <dt>Dinheiro</dt>
          <dd id="hud-money">R$ 0</dd>
        </div>
        <div>
          <dt>FPS</dt>
          <dd id="hud-fps">0</dd>
        </div>
      </dl>
    </div>
    <p id="controls" class="controls">
      <span id="controls-mode">Piloto automático</span> · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou
      setas para dirigir · <kbd>Espaço</kbd> freia
    </p>
    <p id="job-hud" class="job-hud" hidden></p>
    <button id="phone-button" class="phone-button" type="button">Celular (J)</button>
    <div id="overlay" class="overlay"></div>
    <p id="fatal" class="fatal" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
